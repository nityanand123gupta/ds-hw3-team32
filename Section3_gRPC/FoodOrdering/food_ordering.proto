syntax = "proto3";

package foodordering;

// ============================================================
// Food Ordering Service
// Section 3 - Problem 2 (Team 32)
// ============================================================
service FoodOrderingService {
  // Returns the predefined list of restaurants and their menus.
  rpc ListRestaurants(Empty) returns (RestaurantResponse);

  // Places a new order for a customer at a given restaurant.
  rpc PlaceOrder(OrderRequest) returns (OrderResponse);

  // Returns the current status/details of a single order.
  rpc GetOrderStatus(OrderIdRequest) returns (OrderStatusResponse);

  // Cancels an order. Only allowed while the order is still PLACED.
  rpc CancelOrder(OrderIdRequest) returns (Acknowledge);

  // Restaurant-side: view all orders currently pending at a restaurant
  // (i.e. not yet in a terminal state: READY or CANCELLED).
  rpc ViewPendingOrders(RestaurantNameRequest) returns (PendingOrdersResponse);

  // Restaurant-side: advance an order's status.
  // Only the owning restaurant may update its own orders.
  rpc UpdateOrderStatus(OrderStatusUpdate) returns (Acknowledge);

  // Customer-side: server-streaming subscription. The server pushes an
  // OrderUpdate every time the given order's status changes, and closes
  // the stream once the order reaches a terminal state (READY/CANCELLED).
  rpc SubscribeToOrderUpdates(OrderIdRequest) returns (stream OrderUpdate);
}

message Empty {}

message FoodItem {
  string name = 1;
  int32 price = 2;
}

message Restaurant {
  string name = 1;
  repeated FoodItem items = 2;
}

message RestaurantResponse {
  repeated Restaurant restaurants = 1;
}

message OrderItemRequest {
  string item_name = 1;
  int32 quantity = 2;
}

message OrderRequest {
  string customer_id = 1;
  string restaurant_name = 2;
  repeated OrderItemRequest items = 3;
}

message OrderResponse {
  string order_id = 1;
  int32 total = 2;
  string status = 3;
}

// Used for GetOrderStatus / CancelOrder / SubscribeToOrderUpdates.
// requester_id is the customer_id, used only for ownership context in
// logs/errors (any customer may query/track any order id in this
// simplified system, matching the assignment's scope).
message OrderIdRequest {
  string order_id = 1;
  string requester_id = 2;
}

message OrderStatusResponse {
  string order_id = 1;
  string restaurant_name = 2;
  string customer_id = 3;
  repeated OrderItemRequest items = 4;
  int32 total = 5;
  string status = 6;
}

message OrderStatusUpdate {
  string order_id = 1;
  string restaurant_name = 2; // must match the order's own restaurant
  string new_status = 3;      // ACCEPTED | PREPARING | READY
}

message Acknowledge {
  bool success = 1;
  string message = 2;
}

message OrderUpdate {
  string order_id = 1;
  string status = 2;
}

message RestaurantNameRequest {
  string restaurant_name = 1;
}

message PendingOrdersResponse {
  repeated OrderStatusResponse orders = 1;
}
